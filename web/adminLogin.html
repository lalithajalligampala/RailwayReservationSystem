<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Admin Login - Railway Reservation System</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>Railway Reservation System</h1>

    <p>Administrator Login</p>

</header>

<div class="container">

    <div class="section">

        <h2>Admin Login</h2>

        <p>
            Please enter the administrator credentials
            to access the admin panel.
        </p>

        <form action="adminLogin" method="post">

            <label>
                <b>Username:</b>
            </label>

            <br><br>

            <input type="text"
                   name="username"
                   placeholder="Enter admin username"
                   required>

            <br><br>

            <label>
                <b>Password:</b>
            </label>

            <br><br>

            <input type="password"
                   name="password"
                   placeholder="Enter admin password"
                   required>

            <br><br>

            <input type="submit"
                   value="Admin Login">

        </form>

    </div>

    <a class="back-link" href="index.html">
        Back to Home
    </a>

</div>

<footer>

    Railway Reservation System |
    Admin Authentication

</footer>

</body>

</html>
