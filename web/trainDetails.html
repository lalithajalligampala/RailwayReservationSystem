<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Train Details - Railway Reservation</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .details-form {
            max-width: 550px;
            margin: 30px auto;
            padding: 30px;
            background: #f4f8fb;
            border: 1px solid #cbddeb;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .details-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .instruction-box {
            max-width: 550px;
            margin: 20px auto;
            padding: 15px;
            background: #f4f8fb;
            border-left: 5px solid #2c3e50;
            border-radius: 5px;
        }

    </style>

</head>

<body>

    <header>

        <h1>🚆Railway Reservation System</h1>

        <p>Train Details</p>

    </header>


    <div class="container">

        <div class="section">

            <h2>Train Details</h2>

            <p>
                Enter the train number to view complete
                train details.
            </p>


            <div class="details-form">

                <form action="trainDetails" method="get">

                    <div class="form-group">

                        <label for="trainNumber">
                            Train Number
                        </label>

                        <input
                            type="number"
                            id="trainNumber"
                            name="trainNumber"
                            placeholder="Enter Train Number"
                            required
                        >

                    </div>


                    <input
                        type="submit"
                        value="View Train Details"
                        class="details-button"
                    >

                </form>

            </div>


        </div>


        <a href="index.html" class="back-link">
            Back to Home
        </a>

    </div>


    <footer>

        Railway Reservation System |
        Online Train Booking and Reservation
    </footer>

</body>

</html>
