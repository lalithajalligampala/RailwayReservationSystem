<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Search Train by Number</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>🚆 Railway Reservation System</h1>

    <p>Train Search</p>

</header>


<div class="container">


    <div class="section">

        <h2>🔎 Search Train by Number</h2>

        <p>
            Enter the train number to view train details.
        </p>

        <form action="binarySearch" method="get">

            <label>
                <b>Train Number:</b>
            </label>

            <br><br>

            <input type="number"
                   name="trainNumber"
                   placeholder="Example: 12737"
                   min="1"
                   required>

            <br><br>

            <input type="submit"
                   value="Search Train">

        </form>

    </div>


    <a class="back-link" href="index.html">
        ← Back to Home
    </a>

</div>


<footer>

    Railway Reservation System |
    Online Train Booking and Reservation

</footer>

</body>

</html>
